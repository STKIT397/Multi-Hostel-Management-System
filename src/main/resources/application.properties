spring.application.name=multi-hostel-management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostel?currentSchema=aishwarya}
spring.datasource.username=${DB_USER:aishwarya}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
app.setup-admin.username=${ADMIN_SETUP_USERNAME:}
app.setup-admin.password=${ADMIN_SETUP_PASSWORD:}
